<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-panel.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COTATUR - Plataforma Georreferenciada de Turismo</title>
    <script>
      try {
        var t = localStorage.getItem("cotatur-theme") || "sistema";
        var d = t === "oscuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
